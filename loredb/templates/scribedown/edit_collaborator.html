{% extends "scribedown/edit_world_layout.html" %}
{% block title %}
    Edit Collaborator
{% endblock %}
{% block edit_world_content %}
    <h1>Edit Collaborator</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <h3>Permissions for {{ collaborator.user.username }}</h3>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="can_view" name="can_view" {% if collaborator.can_view %}checked{% endif %}>
                <label class="form-check-label" for="can_view">Can View</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="can_create" name="can_create" {% if collaborator.can_create %}checked{% endif %}>
                <label class="form-check-label" for="can_create">Can Create</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="can_edit" name="can_edit" {% if collaborator.can_edit %}checked{% endif %}>
                <label class="form-check-label" for="can_edit">Can Edit</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="can_delete" name="can_delete" {% if collaborator.can_delete %}checked{% endif %}>
                <label class="form-check-label" for="can_delete">Can Delete</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="can_delegate" name="can_delegate" {% if collaborator.can_delegate %}checked{% endif %}>
                <label class="form-check-label" for="can_delegate">Can Delegate</label>
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'edit_world_access' world_id=world.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
