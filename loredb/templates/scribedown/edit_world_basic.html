{% extends "scribedown/edit_world_layout.html" %}
{% block edit_world_content %}
    <h1>Edit World</h1>
    <p>Use the form below to edit the world.</p>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="name" id="name" value="{{ world.name }}" placeholder="World Name">
        <input type="text" name="description" id="description" value="{{ world.description }}" placeholder="Description">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'elements_world' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
