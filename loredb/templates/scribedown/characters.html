{% extends "scribedown/layout.html" %}

{% block title %}
    Characters
{% endblock %}

{% block body %}
    <h1>Characters in {{ world.name }}</h1>
    <ul>
        {% for character in characters %}
            <li><a href="{% url 'character_detail' world.name character.name %}">{{ character.name }}</a></li>
        {% empty %}
            <li>No characters found.</li>
        {% endfor %}
    </ul>
{% endblock %}
