{% extends "scribedown/layout.html" %}

{% block title %}
    Elements
{% endblock %}

{% block body %}
    <h1>Worlds</h1>
    <p>Worlds in the database.</p>
    {% for world in worlds %}
        <a href="{% url 'elements_world' worldname=world.name %}" class="btn btn-secondary">{{ world.name }}</a>
    {% empty %}
        No worlds found.
    {% endfor %}
    <a href="{% url 'new_world' %}" class="btn btn-primary">Create New World</a>
{% endblock %}
