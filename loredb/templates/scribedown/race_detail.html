{% extends "scribedown/layout.html" %}

{% block title %}
    {{ race.name }}
{% endblock %}

{% block body %}
    <h1>{{ race.name }}</h1>
    <p>Description: {{ race.description }}</p>
    <div class="mt-4">
        <a href="{% url 'races' world.name %}" class="btn btn-secondary">Back to Races</a>
    </div>
    <div class="mt-4">
        <a href="{% url 'edit_element' world.name 'race' race.name %}" class="btn btn-primary">Edit Race</a>
        <a href="{% url 'delete_element' world.name 'race' race.name %}" class="btn btn-danger">Delete Race</a>
    </div>
    <div class="mt-4">
        <a href="{% url 'races' world.name %}" class="btn btn-secondary">Back to Races</a>
    </div>
{% endblock %}
