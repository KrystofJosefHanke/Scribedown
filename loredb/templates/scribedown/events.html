{% extends "scribedown/layout.html" %}

{% block title %}
    Events
{% endblock %}

{% block body %}
    <h1>Events in {{ world.name }}</h1>
    <ul>
        {% for event in events %}
            <li><a href="{% url 'event_detail' world.name event.name %}">{{ event.name }}</a></li>
        {% empty %}
            <li>No events found.</li>
        {% endfor %}
    </ul>
{% endblock %}
