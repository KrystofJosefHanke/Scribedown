{% extends "scribedown/layout.html" %}

{% block title %}
    Events
{% endblock %}

{% block body %}
    <h1>Events in {{ world.name }}</h1>
    <ul>
        {% for event in events %}
            <li><a href="{% url 'event_detail' world_id=world.id event_id=event.id %}">{{ event.name }}</a></li>
        {% empty %}
            <li>No events found.</li>
        {% endfor %}
    </ul>
    <div class="mt-4">
        <a href="{% url 'elements_world' world_id=world.id %}" class="btn btn-secondary">Back to World</a>
    </div>
{% endblock %}
