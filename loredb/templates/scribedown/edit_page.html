{% extends "scribedown/layout.html" %}

{% block title %}
    Edit Page
{% endblock %}

{% block body %}
    <h1>Edit Wiki Page</h1>
    <p>Use the form below to edit this wiki page.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <label for="id_title">Title:</label>
        <input type="text" name="title" id="id_title" required value="{{ page.title }}">
        <label for="id_content">Content:</label>
        <textarea name="content" id="id_content" rows="10" required>{{ page.content }}</textarea>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'wiki_page' wiki_id=wiki.id page_id=page.id %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
