{% extends "scribedown/layout.html" %}

{% block title %}
    Delete World
{% endblock %}

{% block body %}
    <h1>Delete World</h1>
    <p>Are you sure you want to delete the world "{{ world.name }}"? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete World</button>
        <a href="{% url 'elements_world' world_id=world.id %}" class="btn btn-secondary">No, Keep World</a>
    </form>
{% endblock %}
