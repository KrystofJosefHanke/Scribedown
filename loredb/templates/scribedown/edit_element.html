{% extends "scribedown/layout.html" %}

{% block title %}
    Edit Element
{% endblock %}

{% block body %}
    <h1>Edit Element</h1>
    <p>Use the form below to edit the element in the world.</p>
    <form method="post">
        {% csrf_token %}
        <label for="element-type">Element Type:</label>
        <select class="form-select" style="background-color: #89ceff;" id="element-type" name="element_type">
            <option selected>Open this select menu</option>
            <option value="character">Character</option>
            <option value="location">Location</option>
            <option value="event">Event</option>
            <option value="item">Item</option>
        </select>
        <input type="text" name="name" placeholder="Name">
        <textarea name="description" placeholder="Description"></textarea>
        <div id="character-fields">
            <h3>Character Fields</h3>
            <input type="text" name="family_name" id="family_name" placeholder="Family Name">
            <input type="text" name="age" id="age" placeholder="Age">
            <select class="form-select" style="background-color: #89ceff;" id="race" name="race">
                <option selected>Races</option>
                {% for race in races %}
                    <option value="{{ race }}">{{ race }}</option>
                {% endfor %}
            </select>
            <select class="form-select" style="background-color: #89ceff;" id="birthplace" name="birthplace">
                <option selected>Birthplaces</option>
                {% for location in locations %}
                    <option value="{{ location.id }}">{{ location.name }}</option>
                {% endfor %}
            </select>
            <select class="form-select" style="background-color: #89ceff;" id="deathplace" name="deathplace">
                <option selected>Deathplaces</option>
                {% for location in locations %}
                    <option value="{{ location.id }}">{{ location.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="location-fields" style="display:none;">
            <h3>Location Fields</h3>
            <input type="text" name="founder" id="founder" placeholder="Founder">
            <input type="text" name="founding_date" id="founding_date" placeholder="Founding Date">
            <input type="text" name="decline_date" id="decline_date" placeholder="Decline Date">
        </div>

        <div id="event-fields" style="display:none;">
            <h3>Event Fields</h3>
            <input type="text" name="date" id="date" placeholder="Date">
            <select class="form-select" style="background-color: #89ceff;" id="location" name="location">
                <option selected>Locations</option>
                {% for location in locations %}
                    <option value="{{ location.id }}">{{ location.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="item-fields" style="display:none;">
            <h3>Item Fields</h3>
            <select class="form-select" style="background-color: #89ceff;" id="locations" name="locations" multiple>
                <option selected>Locations</option>
                {% for location in locations %}
                    <option value="{{ location.id }}">{{ location.name }}</option>
                {% endfor %}
            </select>
            <select class="form-select" style="background-color: #89ceff;" id="characters" name="characters" multiple>
                <option selected>Owners</option>
                {% for character in characters %}
                    <option value="{{ character.id }}">{{ character.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'elements_world' world.name %}" class="btn btn-secondary">Cancel</a>
    </form>
    <script>

    const selector = document.getElementById("element-type");

    const characterFields = document.getElementById("character-fields");
    const locationFields = document.getElementById("location-fields");
    const eventFields = document.getElementById("event-fields");
    const itemFields = document.getElementById("item-fields");


    function updateFields() {

        characterFields.style.display = "none";
        locationFields.style.display = "none";
        eventFields.style.display = "none";
        itemFields.style.display = "none";


        if (selector.value === "character") {
            characterFields.style.display = "block";
        } else if (selector.value === "location") {
            locationFields.style.display = "block";
        } else if (selector.value === "event") {
            eventFields.style.display = "block";
        } else if (selector.value === "item") {
            itemFields.style.display = "block";
        }
    }
    selector.addEventListener("change", updateFields);
    </script>
{% endblock %}
