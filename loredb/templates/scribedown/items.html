{% extends "scribedown/layout.html" %}

{% block title %}
    Items
{% endblock %}

{% block body %}
    <h1>Items in {{ world.name }}</h1>
    <ul>
        {% for item in items %}
            <li><a href="{% url 'item_detail' world.name item.name %}">{{ item.name }}</a></li>
        {% empty %}
            <li>No items found.</li>
        {% endfor %}
    </ul>
    <div class="mt-4">
        <a href="{% url 'elements_world' worldname=world.name %}" class="btn btn-secondary">Back to World</a>
    </div>
{% endblock %}
