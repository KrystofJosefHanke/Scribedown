{% extends "scribedown/layout.html" %}

{% block title %}
    New Wiki
{% endblock %}

{% block body %}
    <h1>Create Wiki</h1>

<form method="post">

    {% csrf_token %}

    <input type="text" name="title" placeholder="Wiki title">

    <br></br>

    <label>Select World</label>

    <select class="form-select" style="background-color: #89ceff;" name="world">
        <option selected>Open this select menu</option>
        {% for world in worlds %}

            <option value="{{ world.id }}">
                {{ world.name }}
            </option>

        {% endfor %}

    </select>

    <br><br>

    <label>
        <input type="checkbox" name="is_public">
        Public Wiki
    </label>

    <br><br>

    <button type="submit" class="btn btn-primary">Create wiki</button>
    <a href="{% url 'wiki_home' %}" class="btn btn-secondary">Cancel</a>

</form>
{% endblock %}
