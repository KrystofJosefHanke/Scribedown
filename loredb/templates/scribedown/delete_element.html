{% extends "scribedown/layout.html" %}

{% block title %}
    Delete Element
{% endblock %}

{% block body %}
    <h1>Delete Element</h1>
    <p>Are you sure you want to delete the element "{{ element.name }}"? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Element</button>
        <a href="{% url 'elements_world' world.name %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
