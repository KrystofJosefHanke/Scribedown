{% load static %}

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'loredb/scribedown.css' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        {% if user.is_authenticated %}
            <p>Scribedown</p>

            <a href="{% url 'index' %}" class="btn btn-primary">Home</a>
            
            <a href="{% url 'elements' %}" class="btn btn-secondary">Elements</a>

            <a href="{% url 'wiki_home' %}" class="btn btn-secondary">Wiki</a>

            <a href="{% url 'community' %}" class="btn btn-secondary">Community</a>

            <a href="{% url 'logout' %}" class="btn btn-secondary">Logout</a>

            <p>Logged in as {{ user.username }}</p>

        {% else %}
            <p>Scribedown</p>

            <a href="{% url 'index' %}" class="btn btn-primary">Home</a>

            <a href="{% url 'community' %}" class="btn btn-secondary">Community</a>

            <a href="{% url 'login' %}" class="btn btn-secondary">Login</a>

            <a href="{% url 'register' %}" class="btn btn-secondary">Create Account</a>

            <p>Currently not logged in.</p>

        {% endif %}

        </nav>
    </head>
    <body>
        <div class="container">
            {% block body %}
            {% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    </body>
</html>
